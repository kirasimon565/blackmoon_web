name: blackmoonstudio
description: "BLACKMOON STUDIO"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  http: ^1.6.0
  url_launcher: ^6.3.1 # Added for opening external links

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/studio/
    - assets/images/backgrounds/
    - assets/images/ui/
    - assets/images/characters/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
